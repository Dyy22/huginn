services:
  cve-discord-bot:
    build:
      context: .
      dockerfile: Dockerfile
    image: cve-discord-bot:latest
    container_name: cve-discord-bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DB_PATH=/data/cve_tracker.db
      - TZ=Asia/Jakarta
    volumes:
      - cve-data:/data

volumes:
  cve-data:
